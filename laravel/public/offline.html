<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8710a">
<title>Sem conexão · LocGestor</title>
<style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f4f7; color: #232733; }
    .caixa { max-width: 380px; text-align: center; background: #fff; border-radius: 12px; padding: 28px 22px;
             box-shadow: 0 2px 10px rgba(0, 0, 0, .08); }
    img { width: 64px; height: 64px; }
    h1 { font-size: 1.25rem; margin: 14px 0 8px; }
    p { color: #5f6676; line-height: 1.5; margin: 0 0 18px; }
    button { font: inherit; font-weight: 600; color: #fff; background: #e8710a; border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer; }
</style>
</head>
<body>
<div class="caixa">
    <img src="assets/icons/icon-192.png" alt="">
    <h1>Sem conexão com a internet</h1>
    <p>O LocGestor precisa de internet para mostrar e gravar os dados. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
</div>
</body>
</html>
